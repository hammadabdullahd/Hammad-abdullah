<!DOCTYPE html>
<html>
<head>
  <title>SolveMate</title>
</head>
<body style="font-family: Arial; text-align: center; padding: 40px; background: #f0f4ff;">
  
  <h1 style="color: #1e3a8a;">SolveMate</h1>
  <p style="font-size: 20px;">Your Problem, Our Solution</p>
  
  <h2 style="color: #1e3a8a;">Ask Your Question</h2>
  
  <form>
    <input type="text" placeholder="Your Name" style="padding: 10px; width: 80%; margin: 5px;"><br>
    <input type="email" placeholder="Your Email" style="padding: 10px; width: 80%; margin: 5px;"><br>
    <textarea placeholder="Write your problem here..." style="padding: 10px; width: 80%; height: 100px; margin: 5px;"></textarea><br>
    <button style="padding: 12px 30px; background: #1e3a8a; color: white; border: none; border-radius: 20px; font-size: 16px;">Submit</button>
  </form>
  
  <p style="margin-top: 40px; color: gray;">© 2025 SolveMate</p>
  
</body>
</html>
